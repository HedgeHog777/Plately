name: Backup Repository

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to backup repositories
  env:
    TOKEN: ${{ secrets.BACKUP_TOKEN }}
  run: |
    git remote add backup-private https://x-access-token:${TOKEN}@github.com/HedgeHog777/Plately.git
    git remote add backup-archive https://x-access-token:${TOKEN}@github.com/HedgeHog777/Plately-Backup.git

    git push backup-private HEAD:main --force || echo "Private backup failed"
    git push backup-archive HEAD:main --force || echo "Archive backup failed"
